<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B4F7C">
  <title>Rendez-vous - HIAR</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/robot_logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='hiar-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='staff.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/patients" aria-label="HIAR - Accueil"><img class="brand-logo" src="{{ url_for('static', filename='img/robot_logo.png') }}" alt="HIAR"></a>
    <span class="topbar-title">Rendez-vous</span>
    <span class="sr-only">Espace médecin</span>

    <nav class="topbar-nav" aria-label="Navigation principale">
      <a href="/patients" class="topbar-nav-link active">Rendez-vous</a>
      <a href="/admin" class="topbar-nav-link">Gestion de HIAR</a>
    </nav>

    <div id="doctor-topbar-actions" class="staff-topbar-actions" style="margin-left: auto;" hidden>
      <button type="button" id="refresh-btn"
              class="btn btn-outline icon-btn staff-refresh-icon"
              aria-label="Actualiser la file" title="Actualiser la file">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" id="logout-btn"
              class="btn btn-outline icon-btn staff-logout-icon"
              aria-label="Déconnexion" title="Déconnexion">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section id="login-panel" class="panel pin-login-panel">
      <div class="pin-card-header">
        <h1>Code d'accès</h1>
        <p class="muted">Entrez le code PIN à 6 chiffres pour accéder aux rendez-vous.</p>
      </div>
      <form id="login-form" autocomplete="off">
        <input id="token" type="hidden" value="">
        <div class="pin-inputs" id="pin-inputs">
          <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="pin-digit" id="pin-1" data-idx="0" autofocus required>
          <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="pin-digit" id="pin-2" data-idx="1" required>
          <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="pin-digit" id="pin-3" data-idx="2" required>
          <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="pin-digit" id="pin-4" data-idx="3" required>
          <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="pin-digit" id="pin-5" data-idx="4" required>
          <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="pin-digit" id="pin-6" data-idx="5" required>
        </div>
        <p id="login-feedback" class="feedback" role="status" aria-live="polite"></p>

        <div class="pin-keypad" aria-label="Pavé numérique">
          <button type="button" class="pin-key" data-val="1">1</button>
          <button type="button" class="pin-key" data-val="2">2</button>
          <button type="button" class="pin-key" data-val="3">3</button>
          <button type="button" class="pin-key" data-val="4">4</button>
          <button type="button" class="pin-key" data-val="5">5</button>
          <button type="button" class="pin-key" data-val="6">6</button>
          <button type="button" class="pin-key" data-val="7">7</button>
          <button type="button" class="pin-key" data-val="8">8</button>
          <button type="button" class="pin-key" data-val="9">9</button>
          <button type="button" class="pin-key pin-clear" data-val="C" title="Effacer">C</button>
          <button type="button" class="pin-key" data-val="0">0</button>
          <button type="submit" class="pin-key pin-submit" id="pin-submit-key" title="Valider">OK</button>
        </div>

        <button type="submit" class="btn" style="margin-top: 18px; width: 100%;">Valider le code PIN</button>
      </form>
    </section>

    <section id="queue-panel" class="panel" hidden>
      <div class="toolbar">
        <div>
          <h1 id="queue-title">Rendez-vous des patients</h1>
          <p class="muted" id="queue-date"></p>
        </div>
        <div class="doctor-quick-select" style="margin-left: auto;">
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" class="btn btn-outline btn-small quick-doc-btn" data-doc="A">Médecin A</button>
            <button type="button" class="btn btn-outline btn-small quick-doc-btn" data-doc="B">Médecin B</button>
            <button type="button" class="btn btn-outline btn-small quick-doc-btn" data-doc="C">Médecin C</button>
            <button type="button" class="btn btn-outline btn-small quick-doc-btn" data-doc="D">Médecin D</button>
          </div>
        </div>
      </div>

      <div id="sessions" class="toolbar-actions" style="margin: 12px 0;"></div>
      <p id="queue-feedback" class="feedback" role="status" aria-live="polite"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ticket</th><th>Période</th><th>Patient</th>
              <th>Téléphone</th><th>Motif</th><th>Constantes (HIAR)</th>
              <th>Statut</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="queue-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='doctor.js') }}" defer></script>
</body>
</html>
