<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12304A">
  <title>HIAR — Espace médecin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='hiar-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='staff.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="HIAR — Accueil"><svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <rect x="4" y="4" width="40" height="40" rx="13" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <rect x="11" y="13" width="26" height="21" rx="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="19" cy="22" r="2.3" fill="currentColor"/>
      <circle cx="29" cy="22" r="2.3" fill="currentColor"/>
      <path d="M18 29 Q24 34 30 29" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M24 13 V8 M20 8 H28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg></a>
    <span class="topbar-title">Espace médecin</span>
    <div id="doctor-topbar-actions" class="staff-topbar-actions" style="margin-left: auto;" hidden>
      <button type="button" id="refresh-btn"
              class="btn btn-outline icon-btn staff-refresh-icon"
              aria-label="Actualiser la file" title="Actualiser la file">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" id="logout-btn"
              class="btn btn-outline icon-btn staff-logout-icon"
              aria-label="Déconnexion" title="Déconnexion">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section id="login-panel" class="panel">
      <h1>Connexion du médecin</h1>
      <p class="muted">Accès réservé au médecin, avec son jeton personnel.</p>
      <form id="login-form">
        <label for="token">Jeton médecin</label>
        <input id="token" type="password" autocomplete="off"
               autocapitalize="none" spellcheck="false" required>
        <div class="doctor-quick-select" style="margin: 12px 0;">
          <p class="muted" style="margin-bottom: 6px; font-size: 13px;">Sélection rapide :</p>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" class="btn btn-outline btn-small quick-doc-btn" data-doc="A">Médecin A</button>
            <button type="button" class="btn btn-outline btn-small quick-doc-btn" data-doc="B">Médecin B</button>
            <button type="button" class="btn btn-outline btn-small quick-doc-btn" data-doc="C">Médecin C</button>
            <button type="button" class="btn btn-outline btn-small quick-doc-btn" data-doc="D">Médecin D</button>
          </div>
        </div>
        <p id="login-feedback" class="feedback"
           role="status" aria-live="polite"></p>
        <button type="submit" class="btn">Accéder à ma file</button>
      </form>
    </section>

    <section id="queue-panel" class="panel" hidden>
      <div class="toolbar">
        <div>
          <h1 id="queue-title">Ma file</h1>
          <p class="muted" id="queue-date"></p>
        </div>

      </div>

      <div id="sessions" class="toolbar-actions"></div>
      <p id="queue-feedback" class="feedback"
         role="status" aria-live="polite"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ticket</th><th>Période</th><th>Patient</th>
              <th>Téléphone</th><th>Motif</th><th>Constantes (HIAR)</th>
              <th>Statut</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="queue-body"></tbody>
        </table>
      </div>
    </section>

    <section id="diagnostics-panel" class="panel diag-panel" aria-live="polite">
      <div class="section-heading">
        <div>
          <h2 class="diag-title">État des capteurs &amp; matériel du robot</h2>
          <p class="muted" id="diag-subtitle" style="margin: 2px 0 0;">Chargement du diagnostic temps réel…</p>
        </div>
        <div class="diag-header-actions">
          <span id="diag-bridge-pill" class="diag-pill diag-offline">Pont en attente</span>
          <button type="button" id="diag-refresh-btn" class="btn btn-outline btn-small">Actualiser</button>
        </div>
      </div>

      <div id="diag-grid" class="diag-grid">
        <!-- Cartes de capteurs rendues dynamiquement par doctor.js -->
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='doctor.js') }}" defer></script>
</body>
</html>
